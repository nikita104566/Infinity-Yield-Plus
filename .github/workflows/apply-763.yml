name: apply-763
on:
  push:
    branches: [sprint/7.63-panel-empty-favmark]
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch to source
        run: |
          set -e
          if [ -f source-7.63.patch ]; then
            patch -p0 < source-7.63.patch
            rm -f source-7.63.patch
            rm -f .github/workflows/apply-763.yml
            git config user.name "iyp-sprint"
            git config user.email "116300960+nikita104566@users.noreply.github.com"
            git add source
            git add -A source-7.63.patch .github/workflows/apply-763.yml
            git commit -m "7.63: bake empty search hint and favorite * mark into source"
            git push
          fi
