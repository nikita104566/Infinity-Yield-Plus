name: apply-763-lastcommand
on:
  workflow_dispatch:
  push:
    branches: [iyp/7.63-lastcommand-empty-safe]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: iyp/7.63-lastcommand-empty-safe
      - name: Apply patch if source still 7.50
        run: |
          if grep -q "lastCmdEmpty" source; then
            echo already applied
            exit 0
          fi
          patch -p1 < source.763.patch
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add source
          git commit -m "7.63: apply lastcommand empty-safe to source"
          git push
